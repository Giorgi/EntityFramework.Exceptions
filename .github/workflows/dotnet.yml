# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]

jobs:
  Build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      # Oracle.EntityFrameworkCore has no release for EF Core 11 yet
      run: >-
        dotnet test --no-build --verbosity normal --report-github
        --filter-not-class "EntityFramework.Exceptions.Tests.OracleTests"
        --coverlet --coverlet-output-format lcov
        --coverlet-include "[EntityFrameworkCore.Exceptions.*]*" --coverlet-include "[DbExceptionClassifier.*]*"
        --coverlet-exclude "[*]EntityFramework.Exceptions.Common.*Exception"
        --results-directory TestResults
    - name: Collect coverage report
      # coverlet.MTP adds a timestamp to the report name
      run: mv TestResults/coverage.*.info TestResults/coverage.info
    - name: Coveralls GitHub Action
      uses: coverallsapp/github-action@v2.3.8
      with: 
        github-token: ${{ secrets.github_token }}
        format: lcov
        fail-on-error: false
        path-to-lcov: TestResults/coverage.info
                  
