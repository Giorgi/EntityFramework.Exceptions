version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/DbExceptionClassifier/*"
      - "/EntityFramework.Exceptions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Major versions are upgraded by hand: most track .NET / EF Core releases, and a major bump of a
      # driver raises the minimum version for every package consumer.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      test-dependencies:
        patterns:
          - "xunit*"
          - "coverlet*"
          - "Microsoft.NET.Test.Sdk"
          - "GitHubActionsTestLogger"
          - "Testcontainers*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
