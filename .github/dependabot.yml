version: 2
updates:
  # Published packages: no version updates. Every bump raises the minimum dependency version for package
  # consumers, so only security updates are wanted. open-pull-requests-limit: 0 disables version updates;
  # Dependabot security updates are not affected by it.
  - package-ecosystem: "nuget"
    directories:
      - "/DbExceptionClassifier/*"
      - "/EntityFramework.Exceptions/Common"
      - "/EntityFramework.Exceptions/MySQL"
      - "/EntityFramework.Exceptions/MySqlConnector"
      - "/EntityFramework.Exceptions/Oracle"
      - "/EntityFramework.Exceptions/PostgreSQL"
      - "/EntityFramework.Exceptions/SqlServer"
      - "/EntityFramework.Exceptions/Sqlite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # Test project: not shipped, keep it current. Majors are upgraded by hand.
  - package-ecosystem: "nuget"
    directory: "/EntityFramework.Exceptions/Tests"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Dependencies of the published projects. Tests references those projects, so without this the test
      # job bumps them in the published .csproj files (see #127). Tests doesn't reference any of them directly.
      # Exact names: a wildcard such as "Npgsql*" would also block Npgsql.EntityFrameworkCore.PostgreSQL.
      - dependency-name: "Microsoft.Data.SqlClient"
      - dependency-name: "Microsoft.Data.Sqlite"
      - dependency-name: "Microsoft.Data.Sqlite.Core"
      - dependency-name: "Microsoft.EntityFrameworkCore.Relational"
      - dependency-name: "MySql.Data"
      - dependency-name: "MySqlConnector"
      - dependency-name: "Npgsql"
      - dependency-name: "Oracle.ManagedDataAccess.Core"
      - dependency-name: "System.Security.Cryptography.Pkcs"
    groups:
      test-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
